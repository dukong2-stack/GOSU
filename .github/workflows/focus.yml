name: focus

# 앱에서 관심·보유 목록(watch.json)이 바뀌면 그 종목들의 상세(5년 표·공시·리포트·뉴스)만 바로 수집
on:
  push:
    paths:
      - watch.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 관심·보유 종목 상세
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python collector/focus.py
      - name: 결과 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "focus: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -X theirs origin main || true
          git push
