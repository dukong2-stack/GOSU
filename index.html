<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고수 노트</title>
<meta name="theme-color" content="#2E4A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#E2E6EC; --ink:#1A2230; --muted:#5F6B7C; --line:#D3D9E1;
  --navy:#2E4A6B; --c-magic:#2F7D6D; --c-graham:#55698A; --c-f:#A97B22; --c-growth:#875479; --c-trend:#C0603A; --c-div:#3F8FB5;
  --up:#D23A2C; --down:#2B5FC9; --warn:#A85B16; --warn-bg:#F7EBDD; --ok:#2F7D6D; --ok-bg:#E1EFEA;
  --radius-l:18px; --radius-s:8px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10141B; --surface:#19202A; --sunk:#232B37; --ink:#E4E9F0; --muted:#97A3B4; --line:#2C3542;
    --navy:#8FAFD6; --c-magic:#5FB3A0; --c-graham:#8BA0C6; --c-f:#D5AC57; --c-growth:#C08AB4; --c-trend:#E58C66; --c-div:#6DB6D8;
    --up:#F26A5C; --down:#6F9BF2; --warn:#E39A55; --warn-bg:#3A2A1B; --ok:#5FB3A0; --ok-bg:#1D3530; color-scheme:dark;
  }
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto}
header.top{padding:14px 18px 8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:12px}
.viewport{flex:1;overflow:hidden;position:relative}
.panes{display:flex;height:100%;width:500%;transition:transform .28s cubic-bezier(.2,.7,.2,1)}
.pane{width:20%;height:100%;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
@media (prefers-reduced-motion:reduce){.panes{transition:none}}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-size:13px;color:var(--muted);font-weight:500;position:relative}
nav.tabs button[aria-selected=true]{color:var(--ink);font-weight:700}
nav.tabs button[aria-selected=true]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--navy)}
.pane h2{font-size:17px;margin:16px 2px 8px;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:13px;margin:0 2px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:0 2px 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--radius-l);overflow:hidden;border:1px solid var(--line)}
.row{background:var(--surface);padding:14px 14px 13px;display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;text-align:left;border:0;width:100%}
.row .rk{font-size:13px;color:var(--muted);padding-top:2px}
.row .nm{font-weight:600;font-size:16px;letter-spacing:-.01em}
.row .meta{font-size:12px;color:var(--muted)}
.row .sc{font-size:22px;font-weight:700;text-align:right;line-height:1.1}
.row .sc span{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.row .body{grid-column:2 / 4;display:flex;flex-direction:column;gap:7px;margin-top:6px}
.row .why{font-size:13px;opacity:.88}
.tag{font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px;font-weight:500}
.t-성장{color:var(--ok)} .t-정체{color:var(--muted)} .t-하향{color:var(--up)} .t-held{color:var(--navy)}
.bd.dv{background:#E3EEF6;color:#2F6D93}
.bd.all{background:#F6E7C1;color:#8A5A00}
.ov{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;align-items:start;margin-top:8px}
.ov b{white-space:nowrap}
.ov .nms{display:flex;flex-wrap:wrap;gap:4px 6px}
.ov .nms button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:1px 7px;font-size:12.5px}
.bd{font-size:11px;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:2px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.flag{font-size:11px;color:var(--warn);margin-left:6px;vertical-align:1px}
.segbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.segbar b{display:block;height:100%}
.more{display:block;width:100%;margin:12px 0;padding:12px;border:1px dashed var(--line);border-radius:12px;background:none;color:var(--muted)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:14px 16px;margin:10px 0}
.block h3{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block h3 small{font-size:12px;color:var(--muted);font-weight:500}
.note{font-size:12.5px;color:var(--muted)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.warnbox p,.okbox p{margin:2px 0}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
ul.why{margin:0;padding-left:18px;font-size:13.5px} ul.why li{margin:3px 0}
.checks{display:flex;flex-direction:column;gap:1px}
.ck{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ck .hd{display:flex;justify-content:space-between;gap:10px}
.ck .hd span:first-child{flex:none}
.ck:last-child{border-bottom:0}
.ck .mk{font-weight:700;text-align:center}
.ck .mk.p1{color:var(--ok)} .ck .mk.p5{color:var(--c-f)} .ck .mk.p0{color:var(--up)} .ck .mk.pn{color:var(--muted)}
.ck .v{text-align:right;color:var(--ink);font-size:13px;min-width:0}
.ck small{display:block;color:var(--muted);font-size:11.5px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar .tr b{display:block;height:100%;border-radius:4px}
.bar span:last-child{text-align:right;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.kv b{display:block;font-size:16px}
.kv small{color:var(--muted);font-size:11.5px}
table.fin{width:100%;border-collapse:collapse;font-size:12px}
table.fin th,table.fin td{padding:5px 3px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.fin th:first-child,table.fin td:first-child{text-align:left}
table.fin th{color:var(--muted);font-weight:500}
.neg{color:var(--up)}
.star{border:0;background:none;font-size:20px;line-height:1;padding:2px 4px;color:var(--muted)}
.star.on{color:#D9A21B}
.star.big{font-size:24px}
.row{position:relative}
.row .star{position:absolute;right:10px;bottom:10px}
.dtabs{display:flex;gap:4px;margin:10px 0 4px;background:var(--sunk);border-radius:10px;padding:3px;position:sticky;top:6px;z-index:2;box-shadow:0 -10px 0 4px var(--bg)}
.dtabs button{flex:1;border:0;background:none;padding:7px 0;border-radius:8px;font-size:13px;color:var(--muted)}
.dtabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
table.t5{width:100%;border-collapse:collapse;font-size:11.5px}
table.t5 th,table.t5 td{padding:5px 2px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.t5 td:first-child,table.t5 th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);white-space:normal;min-width:62px;line-height:1.25}
table.t5 td:first-child small{display:block;font-size:10px;color:var(--muted)}
table.t5 tr.grp td{color:var(--muted);font-weight:600;padding-top:12px;border-bottom:0}
table.t5 td.now{font-weight:600}
.items{display:flex;flex-direction:column}
.it{display:block;padding:9px 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px}
.it:last-child{border-bottom:0}
.it small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.pill{font-size:10.5px;border-radius:4px;padding:0 5px;margin-right:5px;font-weight:600;vertical-align:1px}
.pill.위험{background:var(--warn-bg);color:var(--up)} .pill.주요{background:var(--ok-bg);color:var(--ok)}
.fvbar{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin:22px 0 22px}
.fvbar .rng{position:absolute;top:0;bottom:0;background:var(--ok-bg);border:1px solid var(--ok);border-radius:5px}
.fvbar .now{position:absolute;top:-6px;width:3px;height:22px;background:var(--ink);border-radius:2px}
.fvbar .lb{position:absolute;top:14px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.fvbar .lt{position:absolute;top:-20px;font-size:11px;font-weight:600;transform:translateX(-50%);white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;font-size:13px}
.cmp div{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.cmp div:nth-child(3n+1){text-align:left;color:var(--muted)}
.cmp .h{font-size:11.5px;color:var(--muted)}
textarea.memo{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font:inherit;font-size:13.5px;resize:vertical}
.alert{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.alert:last-child{border-bottom:0}
.alert b{grid-column:1 / 3}
.alert span{color:var(--muted);font-size:12px}
.fld{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0}
/* 조건 */
.cond{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);padding:12px 14px;margin:0 0 12px}
.cond summary{cursor:pointer;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.cond summary small{color:var(--muted);font-weight:500}
.cond h4{font-size:13px;margin:14px 0 6px;color:var(--muted);font-weight:600}
.wrow{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.wrow input{width:100%}
.wrow span:last-child{text-align:right;font-weight:600}
.opt{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:7px 0;flex-wrap:wrap}
.opt input[type=number]{width:62px;padding:3px 6px;text-align:right;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.opt select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.opt input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy)}
.sub{margin-left:26px}
.sumline{font-size:13px;color:var(--muted);margin:2px 2px 10px}
/* 상세 */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;max-width:720px;margin:0 auto}
.sheet.on{display:flex}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet header button{border:0;background:none;font-size:22px;line-height:1;padding:4px 8px}
.sheet header h2{font-size:17px;margin:0;flex:1}
.sheet .body{flex:1;overflow-y:auto;padding:6px 16px 40px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 2px 4px}
.hero .big{font-size:34px;font-weight:700;line-height:1}
.hero .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px;text-decoration:none;color:var(--ink);display:inline-block}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* 보유 */
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form input,.form select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.form .full{grid-column:1 / 3}
.sig{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;display:inline-block}
.sig.keep{background:var(--ok-bg);color:var(--ok)} .sig.watch{background:var(--sunk);color:var(--muted)}
.sig.cut,.sig.sell{background:var(--warn-bg);color:var(--warn)}
.hrow{background:var(--surface);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.hrow .nm{font-weight:600}
.hrow .r{text-align:right}
.hrow .why2{grid-column:1 / 3;font-size:12.5px;color:var(--muted)}
.hrow .del{border:0;background:none;color:var(--muted);font-size:12px;padding:0}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.sum b{display:block;font-size:17px}
.sum small{color:var(--muted);font-size:11.5px}
.up{color:var(--up)} .down{color:var(--down)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}
.method{margin:0 0 4px;font-size:13.5px}
.method b{display:inline-block;min-width:40px}
dl.m{margin:0} dl.m dt{font-weight:600;margin-top:10px} dl.m dd{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="brand"><h1>고수 노트</h1><small id="asof">불러오는 중…</small></div></header>
  <div class="viewport"><div class="panes" id="panes">
    <section class="pane" id="p-cand"></section>
    <section class="pane" id="p-watch"></section>
    <section class="pane" id="p-hold"></section>
    <section class="pane" id="p-hist"></section>
    <section class="pane" id="p-rule"></section>
  </div></div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-i="0">후보</button>
    <button role="tab" aria-selected="false" data-i="1">관심</button>
    <button role="tab" aria-selected="false" data-i="2">보유</button>
    <button role="tab" aria-selected="false" data-i="3">기록</button>
    <button role="tab" aria-selected="false" data-i="4">기준</button>
  </nav>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <header><button id="back" aria-label="닫기">‹</button><h2 id="sh-title"></h2><button id="sh-star" class="star big" aria-label="관심 표시">☆</button></header>
  <div class="body" id="sh-body"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won = x => x==null ? "-" : Math.round(x).toLocaleString("ko-KR");
const eok = x => x==null ? "-" : (Math.abs(x) >= 10000 ? (x/10000).toFixed(1)+"조" : Math.round(x).toLocaleString("ko-KR")+"억");
const money = x => x==null ? "-" : x >= 1e8 ? eok(x/1e8) : Math.round(x/1e4).toLocaleString("ko-KR")+"만";
const sgn = (x,d=1) => x==null ? "-" : (x>0?"+":"")+x.toFixed(d)+"%";
const PARTS = [["magic","마법공식","--c-magic"],["graham","그레이엄","--c-graham"],["fscore","F-스코어","--c-f"],["growth","성장(PEG)","--c-growth"],["trend","추세","--c-trend"],["dividend","배당","--c-div"]];
const PRESETS = {
  "기본(가치·안전)": {w:{magic:30,graham:30,fscore:20,growth:10,trend:10,dividend:0}},
  "배당주 위주": {w:{magic:20,graham:30,fscore:15,growth:5,trend:5,dividend:25}, div:{on:true,y:3,c:5,cut:1}},
  "균형형": {w:{magic:25,graham:20,fscore:20,growth:20,trend:15,dividend:0}},
  "성장·모멘텀": {w:{magic:20,graham:10,fscore:15,growth:30,trend:25,dividend:0}, tags:["성장"]},
};
const BASE = {preset:"기본(가치·안전)", w:{...PRESETS["기본(가치·안전)"].w}, bonus:true, pen:true, mkt:"전체",
  div:{on:false,y:3,c:5,cut:1}, tags:[], fmin:0, permax:"", pbrmax:"", mcmin:"", ma:false, badak:false, dv:false, norisk:false};
const CK = "gosu-cond";
let COND = (() => { try{ return {...BASE, ...JSON.parse(localStorage.getItem(CK)||"{}")}; }catch(e){ return {...BASE}; } })();
const saveCond = () => { try{ localStorage.setItem(CK, JSON.stringify(COND)); }catch(e){} };
function applyPreset(name){ const p = PRESETS[name]; COND = {...BASE, preset:name, w:{...p.w}, div:{...BASE.div, ...(p.div||{})}, tags:[...(p.tags||[])]}; saveCond(); }
const STG = {1:"① 과매도", 2:"② 바닥 형성", 3:"③ 전환 확인"};
let DV=null, L=null, U=null, P=null, H=[], B=null, SNAP=[], D=null, SHOWN=30, PANEL=false, FI={}, SEC={}, AL=[], DTAB="요약", CUR=null;
const FC = {};
const HK = "gosu-holdings", WK = "gosu-watch", SK = "gosu-sync";
const store = k => ({ get(){ try{ return JSON.parse(localStorage.getItem(k)||"[]"); }catch(e){ return []; } },
                      set(v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } });
const watch = store(WK);
const SYNC = { get(){ try{ return JSON.parse(localStorage.getItem(SK)||"{}"); }catch(e){ return {}; } },
               set(v){ try{ localStorage.setItem(SK, JSON.stringify(v)); }catch(e){} } };
const hold = { get(){ try{ return JSON.parse(localStorage.getItem(HK)||"[]"); }catch(e){ return []; } },
               set(v){ try{ localStorage.setItem(HK, JSON.stringify(v)); }catch(e){} } };

/* 탭 */
let tab = 0;
function go(i){ tab=i; $("#panes").style.transform=`translateX(-${i*20}%)`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", +b.dataset.i===i)); }
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => go(+b.dataset.i));
let tx=null, ty=null;
$("#panes").addEventListener("touchstart", e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
$("#panes").addEventListener("touchend", e => { if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5) go(Math.max(0, Math.min(4, tab+(dx<0?1:-1)))); tx=null; }, {passive:true});

async function getJSON(path){ const r = await fetch(`${path}?t=${Date.now()}`, {cache:"no-store"}); if(!r.ok) throw new Error(path); return r.json(); }
async function load(){
  const res = await Promise.allSettled([getJSON("data/latest.json"), getJSON("data/universe.json"), getJSON("data/prices.json"), getJSON("data/history/index.json"),
    getJSON("data/focus_index.json"), getJSON("data/sectors.json"), getJSON("data/alerts.json")]);
  [L, U, P, H, FI, SEC, AL] = res.map(x => x.status==="fulfilled" ? x.value : null);
  H = H || []; FI = FI || {}; SEC = SEC || {}; AL = AL || [];
  try{ B = await getJSON("../badak/data/latest.json"); }catch(e){ B = null; }
  try{ DV = await getJSON("../divnote/data/latest.json"); }catch(e){ DV = null; }
  $("#asof").textContent = L ? `주가 ${fmtDate(L.price_date)} 기준` : "데이터 없음";
  const snaps = await Promise.allSettled(H.slice(0, 12).map(m => getJSON(`data/history/${m}.json`).then(j => ({m, ...j}))));
  SNAP = snaps.filter(x => x.status==="fulfilled").map(x => x.value);
  renderAll();
}
const fmtDate = d => d ? `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}` : "";
function renderAll(){ renderCand(); renderWatch(); renderHold(); renderHist(); renderRule(); }
function watchSet(){ return new Set(watch.get().map(w => w.code)); }
function toggleWatch(code){
  const v = watch.get(), i = v.findIndex(w => w.code===code);
  if(i>=0) v.splice(i,1);
  else { const u = U?.u?.[code]; v.unshift({code, d:new Date().toISOString().slice(0,10), p:priceOf(code), s:u?.sc ?? null, memo:""}); }
  watch.set(v); queueSync(); renderAll(); return i < 0;
}
function badak(){ const m={}; (B?.items||[]).forEach(i => { if((i.stage||0)>=1) m[i.code]=i; }); return m; }
function dvMap(){ const m={}; (DV?.candidates||[]).forEach((c,i) => { m[c.code] = {n:c.name, rk:i+1}; }); return m; }
function overlaps(res){
  const g = new Set(res.slice(0,30).map(x => x.code)), d = dvMap(), b = badak();
  const nm = c => U?.u?.[c]?.n || d[c]?.n || b[c]?.name || nameOf(c);
  const all = [...g].filter(c => d[c] && b[c]);
  const gd = [...g].filter(c => d[c]), gb = [...g].filter(c => b[c]);
  const db = Object.keys(d).filter(c => b[c]);
  return {all, gd, gb, db, nm, g, d, b};
}
function heldSet(){ return new Set(hold.get().map(h => h.code)); }
function priceOf(code){ return P?.p?.[code]?.[1] ?? U?.u?.[code]?.c ?? null; }
function nameOf(code){ return U?.u?.[code]?.n || P?.p?.[code]?.[0] || code; }

function segbar(c){
  const W = COND.w, tot = Object.values(W).reduce((a,b)=>a+b,0) || 1;
  return `<div class="segbar" aria-hidden="true">${PARTS.map(([k,,v],i) => `<b style="width:${(c.p[i]||0)*(W[k]||0)/tot}%;background:var(${v})"></b>`).join("")}</div>`;
}
function legend(){ return `<div class="legend">${PARTS.filter(([k]) => COND.w[k]).map(([k,n,v]) => `<span><i style="background:var(${v})"></i>${n} ${COND.w[k]}</span>`).join("")}</div>`; }
function scoreOf(u){
  const W = COND.w, tot = Object.values(W).reduce((a,b)=>a+b,0) || 1;
  let s = PARTS.reduce((a,[k],i) => a + (W[k]||0)*(u.p[i]||0), 0)/tot;
  if(COND.bonus) s += u.bon||0;
  if(COND.pen) s -= u.pen||0;
  return Math.max(0, Math.min(100, s));
}
function passes(u, code, bm){
  const C = COND, n = x => x==="" || x==null ? null : +x;
  if(C.mkt!=="전체" && u.m!==C.mkt) return false;
  if(C.div.on && !((u.dy||0) >= C.div.y && (u.dc||0) >= C.div.c && (u.cut||0) <= C.div.cut)) return false;
  if(C.tags.length && !C.tags.includes(u.tag)) return false;
  if(C.fmin && !(u.F!=null && u.F >= C.fmin)) return false;
  if(n(C.permax)!=null && !(u.per!=null && u.per <= n(C.permax))) return false;
  if(n(C.pbrmax)!=null && !(u.pbr!=null && u.pbr <= n(C.pbrmax))) return false;
  if(n(C.mcmin)!=null && !((u.mc||0) >= n(C.mcmin))) return false;
  if(C.ma && u.ma!==true) return false;
  if(C.badak && !bm[code]) return false;
  if(C.dv && !dvMap()[code]) return false;
  if(C.norisk && u.risk) return false;
  return true;
}
function results(){
  const bm = badak();
  return Object.entries(U?.u||{}).filter(([c,u]) => u.p && !(u.f||[]).length && passes(u, c, bm))
    .map(([code,u]) => ({code, u, sc:scoreOf(u)})).sort((a,b) => b.sc - a.sc).map((x,i) => ({...x, rk:i+1}));
}
function nFilters(){ const C = COND; return [C.mkt!=="전체", C.div.on, C.tags.length, C.fmin, C.permax!=="", C.pbrmax!=="", C.mcmin!=="", C.ma, C.badak, C.dv, C.norisk].filter(Boolean).length; }

/* ── 후보 ── */
let OVOPEN = true;
function overlapCard(res){
  if(!B && !DV) return "";
  const o = overlaps(res);
  const line = (lab, arr, cls) => `<b class="${cls||""}">${lab} ${arr.length}</b><span class="nms">${arr.length ? arr.map(c => `<button data-ov="${c}" ${o.all.includes(c)?'style="background:#F6E7C1;border-color:#E3C67A;color:#8A5A00;font-weight:600"':""}>${esc(o.nm(c))}</button>`).join("") : `<span class="note">없음</span>`}</span>`;
  return `<details class="cond" id="ovBox" ${OVOPEN?"open":""}><summary>세 앱에서 겹치는 종목 <small>${o.all.length ? `3앱 공통 ${o.all.length}종목` : "3앱 공통 없음"}</small></summary>
    <div class="ov">${line("세 앱 모두", o.all)}${line("고수 + 배당", o.gd)}${line("고수 + 바닥", o.gb)}${line("배당 + 바닥", o.db)}</div>
    <p class="note" style="margin:8px 0 0">고수 = 지금 조건의 상위 30종목 · 배당 = 배당가치 노트 후보 ${DV ? (DV.candidates||[]).length+"종목" : "(자료 없음)"} · 바닥 = 바닥 신호 단계 ①~③ ${B ? Object.keys(o.b).length+"종목" : "(자료 없음)"}. 두 앱 겹침에는 세 앱 공통 종목(금색)도 포함됩니다. 조건을 바꾸면 고수 쪽 목록도 바뀝니다.</p></details>`;
}

      <div class="opt">배당률 <input type="number" step="0.5" data-n="div.y" value="${C.div.y}">% 이상</div>
      <div class="opt">연속 배당 <input type="number" data-n="div.c" value="${C.div.c}">년 이상 (최대 6)</div>
      <div class="opt">최근 5년 삭감 <input type="number" data-n="div.cut" value="${C.div.cut}">회 이하</div></div>
    <h4>기업 조건</h4>
    <div class="opt">시장 <select data-s="mkt">${["전체","KOSPI","KOSDAQ"].map(x => `<option ${C.mkt===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div class="opt">성장 구분 ${["성장","정체","하향"].map(t => `<label style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-tag="${t}" ${C.tags.includes(t)?"checked":""}>${t}</label>`).join("")}<span class="note">(안 고르면 전체)</span></div>
    <div class="opt">F-스코어 <input type="number" min="0" max="9" data-n="fmin" value="${C.fmin||""}" placeholder="-">점 이상</div>
    <div class="opt">PER <input type="number" data-n="permax" value="${C.permax}" placeholder="-">배 이하</div>
    <div class="opt">PBR <input type="number" step="0.1" data-n="pbrmax" value="${C.pbrmax}" placeholder="-">배 이하</div>
    <div class="opt">시가총액 <input type="number" data-n="mcmin" value="${C.mcmin}" placeholder="-" style="width:80px">억 이상</div>
    <h4>시점·위험</h4>
    ${chk("ma", C.ma, "200일선 위 종목만 (상승 추세)")}
    ${chk("badak", C.badak, "바닥 신호 단계(①~③) 종목만" + (B ? "" : " — 바닥 신호 앱 자료 없음"))}
    ${chk("dv", C.dv, "배당가치 노트 후보 종목만" + (DV ? "" : " — 배당가치 노트 자료 없음"))}
    ${chk("norisk", C.norisk, "최근 3년 위험 공시 종목 제외")}
    <div class="links"><button class="btn" id="condReset">기본으로 되돌리기</button></div>
  </details>`;
}
function renderCand(){
  const el = $("#p-cand");
  if(!L || !U){ el.innerHTML = `<div class="empty">아직 수집 결과가 없습니다.<br>저장소 Actions에서 collect를 실행해 주세요.</div>`; return; }
  const bm = badak(), held = heldSet(), ws = watchSet(), res = results(), dm = dvMap(), top30 = new Set(res.slice(0,30).map(x => x.code));

  el.innerHTML = `

    <p class="sumline"><b style="color:var(--ink)">${res.length.toLocaleString()}종목</b> · ${esc(COND.preset)}${nFilters()?` · 필터 ${nFilters()}개`:""}</p>
    ${legend()}
    <div class="list">${rows.map(({code,u,sc,rk}) => {
      const b = bm[code];
      return `<div class="row" role="button" tabindex="0" data-code="${code}">

        <span><span class="nm">${esc(u.n)}</span><span class="tag t-${u.tag}">${u.tag}</span>${held.has(code)?`<span class="tag t-held">보유</span>`:""}${top30.has(code)&&dm[code]&&b?`<span class="bd all">3앱 공통</span>`:""}${dm[code]?`<span class="bd dv">배당 ${dm[code].rk}위</span>`:""}${b?`<span class="bd">${STG[b.stage]}</span>`:""}${u.nw?`<span class="flag">⚠ ${u.nw}</span>`:""}
          <div class="meta">${u.m} · ${esc(u.s)} · PER ${u.per??"-"} · PBR ${u.pbr??"-"}${u.F!=null?` · F ${u.F}/9`:""}${u.dy?` · 배당 ${u.dy}%${u.dc?`(${u.dc}년)`:""}`:""}</div></span>
        <span class="sc">${Math.round(sc)}<span>점</span></span>
        <span class="body">${segbar(u)}<span class="why" style="padding-right:26px">${esc(u.w||"")}</span></span>
        <button class="star ${ws.has(code)?"on":""}" data-star="${code}" aria-label="관심 표시">${ws.has(code)?"★":"☆"}</button>
      </div>`; }).join("") || `<div class="empty" style="background:var(--surface)">조건에 맞는 종목이 없습니다. 조건을 완화해 보세요.</div>`}</div>
    ${res.length > SHOWN ? `<button class="more" id="more">${SHOWN+1}~${Math.min(SHOWN+30, res.length)}위 더 보기</button>` : ""}

  $("#condBox").ontoggle = e => { PANEL = e.target.open; };
  const custom = () => { if(!COND.preset.endsWith("(조정)")) COND.preset = COND.preset + " (조정)"; };
  el.querySelectorAll("[data-w]").forEach(r => { r.oninput = () => { $("#wv-"+r.dataset.w).textContent = r.value; };
    r.onchange = () => { COND.w[r.dataset.w] = +r.value; custom(); rerender(); }; });
  el.querySelectorAll("[data-k]").forEach(c => c.onchange = () => { const k = c.dataset.k;
    if(k==="div.on") COND.div.on = c.checked; else COND[k] = c.checked; custom(); rerender(); });
  el.querySelectorAll("[data-n]").forEach(c => c.onchange = () => { const k = c.dataset.n, v = c.value;
    if(k.startsWith("div.")) COND.div[k.slice(4)] = +v || 0; else COND[k] = k==="fmin" ? (+v||0) : v; custom(); rerender(); });
  el.querySelectorAll("[data-s]").forEach(c => c.onchange = () => { COND[c.dataset.s] = c.value; custom(); rerender(); });

/* ── 상세 ── */
const MK = p => p==null ? ["pn","–"] : p>=1 ? ["p1","✓"] : p>0 ? ["p5","△"] : ["p0","✗"];
function checks(items){
  return `<div class="checks">${items.map(x => { const [c,s] = MK(x.p); return `<div class="ck"><span class="mk ${c}">${s}</span><span><span class="hd"><span>${esc(x.t)}</span><span class="v">${esc(x.v)}</span></span><small>${esc(x.c)}</small></span></div>`; }).join("")}</div>`;
}
function spark(v){
  if(!v || v.length<5) return "";
  const w=320,h=70,mn=Math.min(...v),mx=Math.max(...v),sx=w/(v.length-1),sy=mx>mn?(h-8)/(mx-mn):1;
  const pts=v.map((y,i)=>`${(i*sx).toFixed(1)},${(h-4-(y-mn)*sy).toFixed(1)}`).join(" ");
  const up = v[v.length-1] >= v[0];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="최근 1년 주가 흐름"><polyline points="${pts}" fill="none" stroke="var(${up?"--up":"--down"})" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function findCand(code){ return [...(L?.candidates||[]), ...(L?.others||[])].find(c => c.code===code); }
async function getFocus(code){
  if(code in FC) return FC[code];
  try{ FC[code] = await getJSON(`data/focus/${code}.json`); }catch(e){ FC[code] = null; }
  return FC[code];
}
let CURC = null;
async function openDetail(code){
  CUR = code; DTAB = "요약"; CURC = findCand(code);
  $("#sh-title").textContent = nameOf(code); $("#sh-body").innerHTML = `<div class="empty">불러오는 중…</div>`; showSheet();
  if(!CURC && U?.u?.[code]?.p){ if(!D){ try{ D = await getJSON("data/details.json"); }catch(e){ D = {}; } } CURC = D[code] || null; }
  await getFocus(code);
  renderDetail(); $("#sh-body").scrollTop = 0;
}
function renderDetail(){
  const code = CUR, c = CURC, f = FC[code], on = watchSet().has(code);
  $("#sh-title").textContent = c ? c.name : nameOf(code);

  if(DTAB==="요약") body = c ? detailHTML(c, extraHTML(code, c, f)) : briefHTML(code) + extraHTML(code, c, f) + linksHTML(code, c);
  else if(!f) body = `<div class="empty">${on || heldSet().has(code) ? "관심·보유 목록이 저장소에 반영되면 몇 분 안에(또는 다음 날 아침 수집 때) 표시됩니다." : "관심(☆)으로 표시하면 이 종목의 5년 재무표, 공시, 리포트, 뉴스를 모읍니다."}<br><br>지금은 기본 순위 상위 종목과 관심·보유 종목만 모읍니다.</div>${linksHTML(code, c)}`;
  else if(DTAB==="재무 5년") body = tableHTML(f);
  else if(DTAB==="공시") body = discHTML(f, code, c);
  else body = newsHTML(f, code);
  $("#sh-body").innerHTML = `<div class="dtabs">${tabs.map(t => `<button aria-pressed="${t===DTAB}" data-dt="${t}">${t}</button>`).join("")}</div>` + body;
  $("#sh-body").querySelectorAll("[data-dt]").forEach(b => b.onclick = () => { DTAB = b.dataset.dt; renderDetail(); $("#sh-body").scrollTop = 0; });
  const a = $("#addHold"); if(a) a.onclick = () => { closeDetail(); go(2); setTimeout(() => { $("#hcode").value = nameOf(code); $("#hqty").focus(); }, 300); };
  $("#sh-body").querySelectorAll("[data-memo]").forEach(t => t.onchange = () => {
    const st = t.dataset.memo==="w" ? watch : hold, v = st.get(), it = v.find(x => x.code===code);
    if(it){ it.memo = t.value; st.set(v); renderWatch(); renderHold(); }

}
$("#sh-star").onclick = () => { toggleWatch(CUR); renderDetail(); };

function extraHTML(code, c, f){
  let h = "";

    const lo = Math.min(fv.lo, pr||fv.lo)*0.85, hi = Math.max(fv.hi, pr||fv.hi)*1.1, pos = x => ((x-lo)/(hi-lo)*100).toFixed(1);

    h += `<div class="block"><h3>적정주가 범위 <small style="color:${col};font-weight:700">${fv.sig}</small></h3>
      <div class="fvbar"><span class="rng" style="left:${pos(fv.lo)}%;width:${(pos(fv.hi)-pos(fv.lo)).toFixed(1)}%"></span>

function signal(h){
  const u = U?.u?.[h.code], pr = priceOf(h.code), cfg = L?.config || {}, top = cfg.top_n || 30;
  const stop = (cfg.trend?.stop_loss) || 8, n = U?.n || 1;
  const ret = pr && h.cost ? (pr/h.cost-1)*100 : null;
  if(!u) return {k:"watch", t:"평가 대상 아님", why:"시총 기준 미달이거나 금융업 등 제외 업종입니다", ret};
  if(u.f && u.f.length) return {k:"sell", t:"매도 검토", why:"걸러내기 탈락 — "+u.f.join(", "), ret};
  if(ret!=null && ret <= -stop && u.ma===false) return {k:"cut", t:"손절 검토", why:`매입가 대비 ${ret.toFixed(1)}%, 200일선 아래 (오닐 ${stop}% 규칙)`, ret};
  const lossNote = ret!=null && ret <= -stop ? ` · 매입가 대비 ${ret.toFixed(1)}% (손절선 −${stop}%), 추세는 유지` : "";
  if(u.F!=null && u.F<=3) return {k:"sell", t:"매도 검토", why:`F-스코어 ${u.F}/9 — 재무 악화`, ret};
  if(u.rk > n*0.5) return {k:"sell", t:"교체 검토", why:`순위 ${u.rk}/${n}위로 하위권 — 상위 후보와 비교`, ret};
  if(u.tag==="하향") return {k:"watch", t:"관찰", why:`이익 하향 추세 · ${u.rk}위` + lossNote, ret};
  if(lossNote) return {k:"watch", t:"관찰", why:`${u.rk}위 · ${Math.round(u.sc)}점` + lossNote, ret};
  const fv = FI[h.code]?.fv;
  if(fv && pr && pr > fv.hi) return {k:"sell", t:"차익실현 검토", why:`현재가 ${won(pr)}원이 적정가 상단 ${won(fv.hi)}원 위` + lossNote, ret};
  if(u.rk <= top) return {k:"keep", t:"유지", why:`상위 ${top}위 안 (${u.rk}위, ${Math.round(u.sc)}점)`, ret};
  return {k:"keep", t:"유지", why:`${u.rk}위 · ${Math.round(u.sc)}점 · F ${u.F??"-"}/9`, ret};
}

      <span class="why2">${u.sc!=null?`${Math.round(u.sc)}점 · ${u.rk}위`:"평가 대상 아님"}${ds!=null?` (등록 후 ${ds>=0?"+":""}${ds.toFixed(0)}점)`:""} · ${w.d} 등록 @ ${won(w.p)}${w.memo?`<br>📝 ${esc(w.memo)}`:""}</span>
      <span class="r"><button class="del" data-unw="${w.code}">해제</button></span></div>`; }).join("");
  el.innerHTML = `
    <h2>관심 종목</h2>

    ${al.length ? `<div class="block"><h3>최근 알림 <small>관심·보유 종목</small></h3>${al.map(a => `<div class="alert"><b>${esc(a.n)} · ${esc(a.k)}</b><span>${a.d}</span><span>${esc(a.t)}</span></div>`).join("")}</div>` : ""}
    ${ws.length ? `<div class="list">${rows}</div>` : `<div class="empty">아직 관심 종목이 없습니다.</div>`}

  el.querySelectorAll("[data-unw]").forEach(b => b.onclick = e => { e.stopPropagation(); toggleWatch(b.dataset.unw); });

function syncNote(ws, sy){
  if(sy.token) return `<p class="note" style="margin-top:10px">저장소 동기화 켜짐 · ${sy.last ? `마지막 반영 ${sy.last}` : "아직 반영 전"}${sy.err?` · <span style="color:var(--up)">${esc(sy.err)}</span>`:""}</p>`;
  const miss = ws.filter(w => !FI[w.code]);  // 상위 30위 밖이라 재무표·공시·뉴스를 모으지 않는 관심 종목
  if(!miss.length) return "";
  return `<p class="note" style="margin-top:10px">${miss.map(w => esc(nameOf(w.code))).join(", ")}은(는) 기본 순위 상위 30위 밖이라 재무표·공시·뉴스를 모으지 않습니다. 모으려면 기준 탭에서 저장소 동기화를 켜세요.</p>`;
}

/* ── 저장소 동기화 (관심·보유 종목코드만 watch.json으로) ── */
const REPO = (() => { const h = location.hostname.endsWith("github.io") ? location.hostname.split(".")[0] : "dukong2-stack"; const r = location.pathname.split("/").filter(Boolean)[0] || "gosu"; return {owner:h, repo:r}; })();
let syncTimer = null;
function queueSync(){ if(!SYNC.get().token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500); }
function syncPayload(){ const sy = SYNC.get(); return {watch: watch.get().map(w => w.code), hold: sy.noHold ? [] : hold.get().map(h => h.code)}; }
async function syncNow(){
  const sy = SYNC.get(); if(!sy.token) return false;
  const owner = sy.owner || REPO.owner, repo = sy.repo || REPO.repo;
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/watch.json`;
  const hd = {Authorization:`Bearer ${sy.token}`, Accept:"application/vnd.github+json"};
  try{
    let sha; const g = await fetch(url, {headers:hd, cache:"no-store"});
    if(g.ok){ sha = (await g.json()).sha; } else if(g.status!==404) throw new Error(`읽기 실패 ${g.status}`);
    const body = JSON.stringify({...syncPayload(), updated:new Date().toISOString()}, null, 2) + "\n";
    const content = btoa(String.fromCharCode(...new TextEncoder().encode(body)));
    const r = await fetch(url, {method:"PUT", headers:hd, body:JSON.stringify({message:"관심·보유 목록 갱신", content, sha})});
    if(!r.ok) throw new Error(`저장 실패 ${r.status}${r.status===401||r.status===403?" (토큰 권한 확인)":""}`);
    SYNC.set({...SYNC.get(), last:new Date().toLocaleString("ko-KR"), err:""}); renderWatch(); return true;
  }catch(e){ SYNC.set({...SYNC.get(), err:e.message}); renderWatch(); return false; }
}

function loadXLSX(){ return window.XLSX ? Promise.resolve() : new Promise((ok, ng) => { const t = document.createElement("script");
  t.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"; t.onload = ok; t.onerror = () => ng(new Error("엑셀 도구를 불러오지 못했습니다(인터넷 연결 확인).")); document.head.appendChild(t); }); }
async function exportXLSX(){
  try{ await loadXLSX(); }catch(e){ alert(e.message); return; }
  const wb = XLSX.utils.book_new();
  const hs = [["종목코드","종목명","수량","평균매입가","매입일","매수이유"], ...hold.get().map(h => [h.code, nameOf(h.code), h.qty, h.cost, h.d||"", h.memo||""])];
  const ws = [["종목코드","종목명","등록일","등록가","등록점수","메모"], ...watch.get().map(w => [w.code, nameOf(w.code), w.d||"", w.p??"", w.s??"", w.memo||""])];
  const cs = [["항목","값"], ["조건", JSON.stringify(COND)], ["백업일", new Date().toLocaleString("ko-KR")]];
  for(const [rows, nm] of [[hs,"보유"],[ws,"관심"],[cs,"설정"]]){
    const sh = XLSX.utils.aoa_to_sheet(rows);
    rows.forEach((r,i) => { if(i){ const a = XLSX.utils.encode_cell({r:i,c:0}); if(sh[a]){ sh[a].t = "s"; sh[a].v = String(r[0]); } } });
    sh["!cols"] = rows[0].map((_,j) => ({wch: j===1||j===5 ? 18 : 12}));
    XLSX.utils.book_append_sheet(wb, sh, nm);
  }
  XLSX.writeFile(wb, `고수노트_백업_${new Date().toISOString().slice(0,10)}.xlsx`);
}
async function importFile(f){
  const pad = c => String(c ?? "").replace(/\D/g,"").padStart(6,"0");
  const num = x => x==="" || x==null ? null : +String(x).replace(/,/g,"");
  try{
    if(/\.json$/i.test(f.name)){ const v = JSON.parse(await f.text()); if(Array.isArray(v)){ hold.set(v); queueSync(); renderAll(); alert(`보유 ${v.length}종목을 불러왔습니다.`); } return; }
    await loadXLSX();
    const wb = XLSX.read(await f.arrayBuffer());
    const rows = nm => wb.Sheets[nm] ? XLSX.utils.sheet_to_json(wb.Sheets[nm], {defval:""}) : null;
    const hr = rows("보유"), wr = rows("관심"), cr = rows("설정");
    if(!hr && !wr){ alert("'보유' 또는 '관심' 시트가 없습니다."); return; }
    const msg = [];
    if(hr){ const v = hr.filter(r => r["종목코드"]!=="" && num(r["수량"])>0).map(r => ({code:pad(r["종목코드"]), qty:num(r["수량"]), cost:num(r["평균매입가"]), d:String(r["매입일"]||""), memo:String(r["매수이유"]||"")}));
      if(confirm(`보유 ${v.length}종목으로 바꿀까요? (지금 ${hold.get().length}종목)`)){ hold.set(v); msg.push(`보유 ${v.length}`); } }
    if(wr){ const v = wr.filter(r => r["종목코드"]!=="").map(r => ({code:pad(r["종목코드"]), d:String(r["등록일"]||""), p:num(r["등록가"]), s:num(r["등록점수"]), memo:String(r["메모"]||"")}));
      if(confirm(`관심 ${v.length}종목으로 바꿀까요? (지금 ${watch.get().length}종목)`)){ watch.set(v); msg.push(`관심 ${v.length}`); } }
    const cv = cr?.find(r => r["항목"]==="조건")?.["값"];
    if(cv && confirm("저장된 검색 조건도 불러올까요?")){ try{ COND = {...BASE, ...JSON.parse(cv)}; saveCond(); msg.push("조건"); }catch(_){} }
    queueSync(); renderAll(); if(msg.length) alert(msg.join(", ") + " 불러왔습니다.");
  }catch(e){ alert("파일을 읽지 못했습니다: " + e.message); }
}

    <h2>설정</h2>
    <div class="block"><h3>엑셀 백업·복구</h3>
      <p class="method">보유(수량·매입가·매수 이유), 관심(등록가·메모), 검색 조건을 엑셀 파일 하나로 저장합니다. 엑셀에서 고친 뒤 다시 불러와도 됩니다(열 이름은 그대로).</p>
      <div class="links"><button class="btn pri" id="bkx">엑셀로 백업</button><label class="btn">엑셀 불러오기<input type="file" id="rsx" accept=".xlsx,.xls,.json" hidden></label></div>
      <p class="note" style="margin:8px 0 0">처음 보유 종목을 넣을 때 백업 파일의 '보유' 시트에 붙여 넣고 불러오면 한 번에 들어갑니다.</p></div>
    <div class="block"><h3>저장소 동기화 <small>${sy.token ? "켜짐" : "꺼짐"}</small></h3>
      <p class="method">관심·보유 종목의 <b>종목코드만</b> 저장소의 watch.json에 올립니다. 그래야 그 종목들의 5년 재무표, 공시, 리포트, 뉴스를 모으고 알림을 보냅니다. 수량·매입가·메모는 올리지 않습니다.</p>
      <input class="fld" id="tok" type="password" placeholder="GitHub 토큰 (github_pat_…)" value="${sy.token ? "••••••••" : ""}" autocomplete="off">
      <label class="opt" style="flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="noHold" ${sy.noHold?"checked":""}><span>보유 종목은 올리지 않기 (공개 저장소에 보이지 않게)</span></label>
      <div class="links"><button class="btn pri" id="tokSave">저장하고 지금 반영</button>${sy.token?`<button class="btn" id="tokDel">토큰 삭제</button>`:""}</div>
      <p class="note" style="margin:8px 0 0">대상 저장소: ${esc(REPO.owner||"?")}/${esc(REPO.repo)} · ${sy.last ? `마지막 반영 ${sy.last}` : "반영 기록 없음"}${sy.err?` · <span style="color:var(--up)">${esc(sy.err)}</span>`:""}</p>
      <details style="margin-top:8px"><summary class="note" style="cursor:pointer">토큰 없이 직접 반영하기</summary>
        <p class="note">저장소의 watch.json을 열어 연필(편집)을 누르고 아래 내용으로 바꿔 저장하세요.</p>
        <textarea class="memo" readonly style="font-size:12px">${esc(JSON.stringify(syncPayload()))}</textarea></details></div>`;
  $("#bkx").onclick = exportXLSX;
  $("#rsx").onchange = e => { const f = e.target.files[0]; if(f) importFile(f); e.target.value = ""; };
  $("#tokSave").onclick = async () => { const t = $("#tok").value.trim(), cur = SYNC.get();
    const token = t && !t.startsWith("••") ? t : cur.token;
    if(!token){ alert("토큰을 입력해 주세요."); return; }
    SYNC.set({...cur, token, noHold:$("#noHold").checked}); const ok = await syncNow(); renderRule();
    alert(ok ? "저장소에 반영했습니다. 몇 분 뒤 관심 종목 상세가 수집됩니다." : "반영하지 못했습니다: " + (SYNC.get().err||"")); };
  const td = $("#tokDel"); if(td) td.onclick = () => { const cur = SYNC.get(); delete cur.token; SYNC.set(cur); renderRule(); renderWatch(); };
  $("#noHold").onchange = e => { SYNC.set({...SYNC.get(), noHold:e.target.checked}); queueSync(); renderRule(); };
}

load();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
